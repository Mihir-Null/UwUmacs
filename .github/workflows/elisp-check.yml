name: Elisp checks

on:
  push:
    branches: [firemacs-meow]
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    name: Emacs 30.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@54b61ac9c1d7011a54d2b6d66dedbcddf20e2fb9
        with:
          version: 30.1
      - name: Check Elisp delimiters
        run: emacs -Q --batch -l scripts/check-elisp.el
